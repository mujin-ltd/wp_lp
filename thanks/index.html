<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込みありがとうございます｜EC新規顧客獲得大全</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{
  --primary:#0A5BC4;
  --primary-dark:#073E8A;
  --text-dark:#13213A;
  --text-sub:#4A5670;
  --text-muted:#8592A8;
  --bg-blue:#EAF2FC;
  --bg-gray:#F5F8FC;
  --border-blue:#CBE0F7;
  --border:#e4e8ee;
  --green:#16A34A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:var(--text-dark);line-height:1.8;background:var(--bg-gray);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 1.25rem}

.card{width:100%;max-width:640px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:3rem 2.5rem;text-align:center}

.check-icon{width:64px;height:64px;border-radius:50%;background:var(--bg-blue);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 1.5rem}

.eyebrow{font-size:12px;color:var(--primary);letter-spacing:2px;font-weight:600;margin-bottom:10px}
h1{font-size:26px;font-weight:700;color:var(--text-dark);margin-bottom:14px;line-height:1.5}
.lead{font-size:15px;color:var(--text-sub);margin-bottom:2rem}

.kv-thumb{width:100%;max-width:360px;margin:0 auto 2rem;border-radius:10px;overflow:hidden;box-shadow:0 4px 20px rgba(17,24,42,.08)}
.kv-thumb img{display:block;width:100%}

.dl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:360px;background:var(--primary);color:#fff;text-decoration:none;border-radius:6px;padding:16px;font-size:16px;font-weight:600;transition:background .15s}
.dl-btn:hover{background:var(--primary-dark)}
.dl-btn i{font-size:20px}

.note{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.7}

.divider{border-top:1px solid var(--border);margin:2.5rem 0}

.back-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text-sub);text-decoration:none}
.back-link:hover{color:var(--primary)}
.back-link i{font-size:16px}
</style>
</head>
<body>

<div class="card">
  <div class="check-icon"><i class="ti ti-check"></i></div>
  <p class="eyebrow">THANK YOU</p>
  <h1>お申し込みありがとうございます</h1>
  <p class="lead">「EC新規顧客獲得大全」のお申し込みを受け付けました。<br>下のボタンからすぐに資料をダウンロードいただけます。</p>

  <div class="kv-thumb">
    <img src="../assets/kv.jpg" alt="EC新規顧客獲得大全 meta運用/CVR改善/楽天/amazon">
  </div>

  <a class="dl-btn" href="../assets/ec-shinki-kakutoku-taizen.pdf" download="EC新規顧客獲得大全.pdf"><i class="ti ti-download"></i>資料をダウンロードする</a>
  <p class="note">※ご入力いただいたメールアドレス宛にも、資料のダウンロードURLをお送りしています。</p>

  <div class="divider"></div>

  <a class="back-link" href="/"><i class="ti ti-arrow-left"></i>LPトップに戻る</a>
</div>

</body>
</html>
